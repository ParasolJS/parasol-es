version: 2

updates:
  # ---------------------------------------------------------------------------
  # npm
  #
  # NOTE: dist/ is committed to this repo (demos load dist/parasol.standalone.js
  # directly from the checkout). Dependabot only edits package.json and
  # package-lock.json -- it does NOT run `npm run build`, so a merged PR can
  # leave dist/ stale relative to the new lockfile.
  #
  # This is NOT limited to runtime deps. The build toolchain (rollup, @babel/*)
  # lives in devDependencies and determines dist/ bytes directly: rollup
  # 4.60.1 -> 4.62.2 in PR #39 changed identifier deconfliction in the
  # standalone bundle (exports$1 -> exports) and required a rebuild commit.
  #
  # So: after merging ANY npm PR, run `npm run build` and compare against the
  # committed artifacts --
  #     git rev-parse :dist/parasol.standalone.js   # committed blob
  #     git hash-object dist/parasol.standalone.js  # rebuilt blob
  # Equal hashes mean nothing to do. Comparing raw bytes instead of blob hashes
  # gives false positives on Windows, where the build writes CRLF.
  # ---------------------------------------------------------------------------
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
      day: monday
    open-pull-requests-limit: 5
    commit-message:
      prefix: chore
      prefix-development: chore
      include: scope
    groups:
      # One PR per week for the build/lint/docs toolchain. These never reach
      # consumers (npm installs only `dependencies` transitively), so they are
      # safe to batch -- but see the rebuild note above: rollup and @babel/*
      # still change dist/ output even though they are dev-scope.
      dev-tooling:
        dependency-type: development
        update-types:
          - minor
          - patch
      # Runtime minor/patch batched separately so the "needs a rebuild" PRs stay
      # visually distinct from toolchain noise.
      runtime:
        dependency-type: production
        update-types:
          - minor
          - patch
    # Majors are deliberately left ungrouped so each arrives as its own PR --
    # d3 v7 -> v8 or rollup 4 -> 5 deserves individual review, not a batch merge.

  # ---------------------------------------------------------------------------
  # GitHub Actions used by .github/workflows/ci.yml
  # ---------------------------------------------------------------------------
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: monthly
    commit-message:
      prefix: ci
      include: scope
    groups:
      actions:
        update-types:
          - minor
          - patch
